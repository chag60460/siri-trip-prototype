services:
  - type: web
    name: siri-agent-prototype
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.7.0
      - key: SIRI_EMBED_ORIGINS
        value: https://chag60460.github.io
      - key: GEMINI_API_KEY
        sync: false
